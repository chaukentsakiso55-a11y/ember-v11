name: Build Ember V11 Android APK
on:
  push:
    branches: [android-rebuild]
    paths:
      - 'android-app/ember-android-source.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -q android-app/ember-android-source.zip -d android-app/build-src
      - name: Build debug APK
        run: gradle -p android-app/build-src :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-v11-android-apk
          path: android-app/build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ember-android-${{ github.run_number }}
          name: Ember V11 Android build ${{ github.run_number }}
          generate_release_notes: true
          files: android-app/build-src/app/build/outputs/apk/debug/app-debug.apk
