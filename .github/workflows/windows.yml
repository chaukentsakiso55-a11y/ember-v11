name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "Ember-V11" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-V11-Windows
          path: dist/Ember-V11.exe
